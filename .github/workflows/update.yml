name: update-profile
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [profile-refresh]

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save sharp
      - run: node scripts/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md data
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile assets"
          git pull --rebase
          git push
