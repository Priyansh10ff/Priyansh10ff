# Copy this file into .github/workflows/ of a repo you push to often.
# Add a secret PROFILE_DISPATCH_TOKEN in that repo (a classic token with the repo scope).
# Every push there asks the profile repo to rebuild within a minute or two.
name: ping-profile
on:
  push:
    branches: [main, master]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PROFILE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Priyansh10ff/Priyansh10ff/dispatches \
            -d '{"event_type":"profile-refresh"}'
